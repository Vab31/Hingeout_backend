name: Daily High-CPC Job Digest Dispatcher

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST every day
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of emails to dispatch in this run'
        required: false
        default: '1000'
      offset:
        description: 'Subscriber row offset to start from'
        required: false
        default: '0'
      dry_run:
        description: 'Run in dry-run simulation mode without sending emails'
        required: false
        default: 'false'

jobs:
  dispatch-digest:
    name: Dispatch Daily Job Digest
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🚀 Run Daily Job Digest Dispatcher
        env:
          # SMTP / Email Credentials
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || 'HingeOut Jobs <jobs@hingeout.com>' }}

          # App & API Secrets
          ARTHA_API_KEY: ${{ secrets.ARTHA_API_KEY }}
          ARTHA_API_BASE_URL: https://api-usa.artha.link/api/v1
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'hingeout_secure_email_secret_2026' }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://hingeout.com' }}
          MONGO_URI: ${{ secrets.MONGO_URI }}

          # Batch execution params
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '1000' }}
          BATCH_OFFSET: ${{ github.event.inputs.offset || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "Starting daily dispatch run..."
          node scripts/sendDailyJobDigest.js
